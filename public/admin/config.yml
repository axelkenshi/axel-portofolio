backend:
  name: github
  repo: axelkenshi/axel-portofolio
  branch: main

media_folder: public/media
public_folder: /media

# Admin browser tab logo and icon (sourced from /favicon.svg in the public folder)
logo:
  src: /favicon.svg
  show_in_header: true

# Text slug cleaning (global), Markdown filename generator
slug:
  encoding: ascii
  clean_accents: true
  lowercase: false
  trim: true
  sanitize_replacement: "_"

collections:
  - name: notes
    label: Notes
    label_singular: Note
    folder: content/notes
    extension: md
    format: frontmatter
    create: true
    slug:
      editable: [create]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Cover Image URL (CDN), name: img, widget: string, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { label: Category, name: category, widget: string, default: "Uncategorized" }
      - { label: Content, name: body, editor_components: [table, callout, youtube, cdn-image, cdn-grid, link-card, code-file, terminal, details, code-diff, cdn-video, iframe-embed, math, mermaid, plot-2d, chart-bar, chart-donut, chart-line, chart-heatmap], widget: markdown }

  - name: blogging
    label: Blogging
    label_singular: Artikel
    folder: content/blogging
    extension: md
    format: frontmatter
    create: true
    slug:
      editable: [create]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Cover Image URL (CDN), name: img, widget: string, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { label: Content, name: body, editor_components: [callout, youtube, cdn-image, cdn-grid, link-card, code-file, terminal, details, code-diff, cdn-video, iframe-embed, plot-2d, chart-bar, chart-donut, chart-line, chart-heatmap], widget: markdown }
  