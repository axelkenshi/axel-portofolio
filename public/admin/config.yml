backend:
  name: github
  repo: axelkenshi/axel-portofolio
  branch: main

media_folder: public/media
public_folder: /media

# Logo dan ikon tab browser admin (dipakai dari /favicon.svg di folder public)
logo:
  src: /favicon.svg
  show_in_header: true

# Pembersihan teks slug (global)
slug:
  encoding: ascii
  clean_accents: true
  lowercase: false
  trim: true
  sanitize_replacement: "_"

collections:
  - name: notes
    label: Notes
    label_singular: Note
    folder: content/notes
    extension: md
    format: frontmatter
    create: true
    slug:
      editable: [create]
    fields:
      - { label: Judul, name: title, widget: string }
      - { label: Deskripsi, name: description, widget: text, required: false }
      - { label: URL Gambar (CDN), name: img, widget: string, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Tanggal, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { label: Kategori, name: category, widget: string, default: "Uncategorized" }
      - { label: Isi, name: body, editor_components: [callout, youtube, cdn-image, iframe-embed], widget: markdown }

  - name: blogging
    label: Blogging
    label_singular: Artikel
    folder: content/blogging
    extension: md
    format: frontmatter
    create: true
    slug:
      editable: [create]
    fields:
      - { label: Judul, name: title, widget: string }
      - { label: Deskripsi, name: description, widget: text, required: false }
      - { label: URL Gambar (CDN), name: img, widget: string, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Tanggal, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { label: Isi, name: body, editor_components: [callout, youtube, cdn-image, iframe-embed], widget: markdown }
  